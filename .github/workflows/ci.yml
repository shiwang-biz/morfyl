name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Engines + Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick pandoc ghostscript p7zip-full \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Conversion core (unit + real conversions)
        run: cargo test -p convert-core -- --nocapture
      - name: App compiles
        run: cargo check -p morfyl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
