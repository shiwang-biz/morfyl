name: Engine packs

# Builds the small engines Morfyl downloads on first use (Pandoc, Ghostscript, 7-Zip)
# and publishes them, plus manifest.json, to a release tagged "engines".
# Run it once (Actions -> Engine packs -> Run workflow) and again whenever versions.env changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    name: Packs (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: macos-aarch64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: windows-latest, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config

      - name: MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit # so the preinstalled 7-Zip is reachable
          install: zip unzip

      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/engines/pack-engines.sh

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/engines/pack-engines.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packs-${{ matrix.platform }}
          path: dist-engines/*.zip

  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packs-*
          merge-multiple: true
          path: dist-engines
      - name: Write manifest
        run: |
          python3 scripts/engines/make-manifest.py dist-engines "https://github.com/${{ github.repository }}/releases/download/engines"
          python3 scripts/engines/resolve-installers.py dist-engines/manifest.json
          cat dist-engines/manifest.json
      - name: Publish release "engines"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view engines >/dev/null 2>&1 || \
            gh release create engines --title "Engine packs" --notes "Downloaded by Morfyl on first use. Do not delete." --latest=false
          gh release upload engines dist-engines/* --clobber
