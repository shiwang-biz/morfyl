[package]
name = "morfyl"
authors = ["Craziest Coders <https://craziestcoders.com>"]
homepage = "https://craziestcoders.com"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Morfyl – convert images, video, audio, documents, ebooks and archives"
default-run = "morfyl"

[lib]
name = "morfyl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
convert-core = { path = "../crates/convert-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs", "rt"] }
